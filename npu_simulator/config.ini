[NPU_Hardware_Spec]
# Dimensions of the 2D Systolic Array (e.g. 512 means a 512x512 PE Grid = 262k multipliers)
grid_size = 512

# Physical centralized SRAM scratchpad size (in Megabytes)
sram_capacity_mb = 128

# Clock frequency of the systolic PE array (in GHz)
frequency_ghz = 1.0

# External HBM bandwidth speed (in Gigabytes per second)
hbm_bandwidth_gb_s = 2400.0

# Central SRAM global bus read/write interface bandwidth (in Gigabytes per second)
sram_bus_bandwidth_gb_s = 4800.0
