[RDU_Hardware_Spec]
# Dimensions of the 2D mesh grid (e.g. 32 means 32x32 = 1024 tiles)
grid_size = 32

# Physical SRAM capacity in each PMU tile (in Kilobytes)
sram_per_pmu_kb = 128

# Clock frequency of each reconfigurable PCU tile (in GHz)
pcu_frequency_ghz = 1.0

# External High-Bandwidth Memory (HBM) speed (in Gigabytes per second)
hbm_bandwidth_gb_s = 2400.0

# Network-on-Chip (NoC) routing link speed between adjacent tiles (in Gigabytes per second)
noc_link_bandwidth_gb_s = 256.0

# Hardware stream compression mode (None, FP8, INT4)
compression_mode = INT4
